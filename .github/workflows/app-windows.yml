# Compila la app KusiVox para Windows (KusiVox.exe + KusiVoxServidor.exe), la prueba,
# arma el instalador con Inno Setup y publica todo en una version (release) de GitHub.
name: App KusiVox para Windows

on:
  push:
    branches:
      - kusivox-apps
    paths:
      - app-windows/**
      - .github/workflows/app-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Compilar, probar y publicar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: app-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Genera el modulo de UI Automation (clic por nombre) para que viaje dentro del .exe
          python -c "import comtypes.client as c; c.GetModule('UIAutomationCore.dll'); from comtypes.gen import UIAutomationClient; print('UI Automation listo')"

      - name: Probar que entiende distintas formas de pedir
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python prueba_frases.py
          if ($LASTEXITCODE -ne 0) { throw "prueba_frases fallo" }
          python prueba_acciones.py
          if ($LASTEXITCODE -ne 0) { throw "prueba_acciones fallo" }

      - name: Compilar los ejecutables
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KusiVox --icon kusivox.ico --add-data "kusivox.ico;." --add-data "mascota_feliz.gif;." --add-data "mascota_pensando.gif;." --add-data "mascota_dormido.gif;." kusivox_app.py
          pyinstaller --noconfirm --onefile --console --name KusiVoxServidor --icon kusivox.ico --collect-submodules mcp.server --collect-submodules mcp.shared --collect-submodules mcp.types --collect-submodules mcp.os --exclude-module mcp.cli --copy-metadata mcp --collect-submodules comtypes kusivox_servidor.py
          Get-ChildItem dist

      - name: Probar el servidor (24 herramientas por MCP)
        env:
          PYTHONIOENCODING: utf-8
        run: python prueba_servidor.py dist\KusiVoxServidor.exe

      - name: Probar la ventana y el cifrado
        run: |
          $p = Start-Process -FilePath dist\KusiVox.exe -ArgumentList '--autoprueba' -PassThru -Wait
          Get-Content "$env:TEMP\kusivox_autoprueba.txt"
          if ($p.ExitCode -ne 0) { throw "La autoprueba de la ventana fallo" }

      - name: Captura de la ventana (para el informe)
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\KusiVox.exe -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\kusivox_ventana.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          $w = "$env:RUNNER_TEMP\capturas"
          git worktree add --detach $w
          Push-Location $w
          git checkout --orphan capturas
          git rm -rf -q .
          Copy-Item "$env:RUNNER_TEMP\kusivox_ventana.png" .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add kusivox_ventana.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Captura de la ventana de KusiVox en Windows"
          git push -f -q origin capturas
          Pop-Location

      - name: Probar en un Windows real (Bloc de notas, clic por nombre, mouse y YouTube)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Chrome nuevo muestra una bienvenida; el archivo "First Run" la salta (solo en el servidor de pruebas)
          New-Item -ItemType File -Force "$env:LOCALAPPDATA\Google\Chrome\User Data\First Run" | Out-Null
          python prueba_windows_real.py
          $codigo = $LASTEXITCODE
          Get-Process notepad, chrome, msedge, CalculatorApp, calc -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($codigo -ne 0) { throw "La prueba en Windows real tuvo fallos" }

      - name: Instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc kusivox.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallo" }
          Compress-Archive -Path dist\KusiVox.exe, dist\KusiVoxServidor.exe -DestinationPath Output\KusiVox-Portable.zip

      - name: Agregar el firmware de KusiVox (si ya esta compilado)
        run: |
          git fetch origin descarga-firmware
          foreach ($f in @("kusivox-v3-mascotas.bin", "kusivox-v2-shihtzu.bin")) {
            cmd /c "git show origin/descarga-firmware:firmware/$f > Output\$f"
            if ((Get-Item "Output\$f").Length -lt 1000000) { Remove-Item "Output\$f"; "Firmware $f aun no disponible" }
          }
          Get-FileHash Output\* -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 220

      - uses: actions/upload-artifact@v4
        with:
          name: kusivox-windows
          path: app-windows/Output/*

      - name: Publicar la version KusiVox 1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kusivox-v1.3.0 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create kusivox-v1.3.0 (Get-ChildItem Output\*).FullName --title "KusiVox 1.3.0" --notes-file NOTAS.md --target $env:GITHUB_SHA
