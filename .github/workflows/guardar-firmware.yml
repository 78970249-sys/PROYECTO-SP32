# Copia el firmware compilado (artefacto) a esta rama para poder descargarlo como archivo normal.

name: Guardar firmware para descargar

on:
  push:
    branches:
      - descarga-firmware
    paths:
      - .github/workflows/guardar-firmware.yml

permissions:
  actions: read
  contents: write

jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Descargar el firmware compilado
        uses: actions/download-artifact@v7
        with:
          name: lcd-240x240-10mhz-jarvis
          run-id: 44213452177
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware

      - name: Guardarlo en la rama
        shell: bash
        run: |
          md5sum firmware/lcd-240x240-10mhz-jarvis.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add firmware/lcd-240x240-10mhz-jarvis.bin
          git commit -m "Firmware LCD 240x240 10 MHz Jarvis para descargar"
          git push
