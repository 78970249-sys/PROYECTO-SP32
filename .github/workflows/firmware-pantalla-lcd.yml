# Compila el firmware XiaoZhi para la protoboard con pantalla LCD ST7789 240x240 de 8 pines,
# con KusiVox como cachorro shih tzu de cuerpo completo (carpeta caritas/: 21 animaciones GIF de 240x240).
#
# Cambios respecto al firmware oficial:
#  - Senal SPI de la pantalla a 20 MHz (el oficial usa 40 MHz) para cables dupont largos.
#  - Las animaciones de caritas/ (shih tzu sin ropa, solo con su pelaje, generadas con
#    herramientas/generar_shihtzu.py) reemplazan los emojis por defecto.
#  - Emociones por frase: el personaje cambia de animacion segun las palabras de cada frase
#    que dice (firmware/kusivox/emocion_por_frase.h).
#  - Producto KusiVox: palabra de activacion personalizada "kusi vox" con MultiNet7
#    en ingles (mn7_en), red de configuracion "KusiVox-XXXX" e indicador de bateria
#    (18650: divisor 100k/100k en GPIO 1; USB conectado por divisor en GPIO 2).
#
# Conexiones de la pantalla: SCL->GPIO21, SDA->GPIO47, RES->GPIO45, DC->GPIO40,
# CS->GPIO41, BLK->GPIO42, VCC->3V3, GND->GND.
#
# Resultado: kusivox-v2-shihtzu.bin (artefacto y rama descarga-firmware).
# Se graba con ESP Tool en la direccion 0x0.

name: Firmware pantalla LCD 240x240

on:
  push:
    branches:
      - pantalla-lcd-240x240
    paths-ignore:
      - .github/workflows/verificar-firmware.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar KusiVox v2 (shih tzu animado, emociones por frase, bateria)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    env:
      CUSTOM_EMOJI_DIR: ${{ github.workspace }}/proyecto/caritas
      ARCHIVO: kusivox-v2-shihtzu.bin
    steps:
      - name: Descargar el firmware oficial xiaozhi-esp32 (v2.6.0)
        uses: actions/checkout@v7
        with:
          repository: 78/xiaozhi-esp32
          ref: aaf1eb7798cabee87a0c6a0649aabf4d17e9e383

      - name: Descargar este proyecto (caritas)
        uses: actions/checkout@v7
        with:
          path: proyecto

      - name: Velocidad SPI de la pantalla a 20 MHz
        shell: bash
        run: |
          FILE=main/boards/bread-compact-wifi-lcd/compact_wifi_board_lcd.cc
          sed -i 's/io_config.pclk_hz = 40 \* 1000 \* 1000;/io_config.pclk_hz = 20 * 1000 * 1000;/' "$FILE"
          grep -n "io_config.pclk_hz = 20 \* 1000 \* 1000;" "$FILE"

      - name: Usar las caritas propias como emojis
        shell: bash
        run: |
          ls "$CUSTOM_EMOJI_DIR"/*.gif | wc -l
          test -f "$CUSTOM_EMOJI_DIR/neutral.gif"
          python3 - <<'EOF'
          p = "scripts/build_default_assets.py"
          s = open(p, encoding="utf-8").read()
          viejo = "    if not default_emoji_collection:\n        return None\n"
          nuevo = viejo + ("    custom = os.environ.get('CUSTOM_EMOJI_DIR')\n"
                           "    if custom and os.path.isdir(custom):\n"
                           "        print(f'Usando caritas propias: {custom}')\n"
                           "        return custom\n")
          assert s.count(viejo) == 1
          open(p, "w", encoding="utf-8").write(s.replace(viejo, nuevo))
          EOF
          grep -n "CUSTOM_EMOJI_DIR" scripts/build_default_assets.py

      - name: Palabra de activación personalizada "KusiVox" (MultiNet7 en inglés)
        shell: bash
        run: |
          python3 - <<'EOF'
          p = "scripts/build.py"
          s = open(p, encoding="utf-8").read()
          viejo = '    normalized = wake_word.strip().casefold().replace("-", "_")\n'
          nuevo = viejo + (
              '    if normalized == "kusivox":\n'
              '        return "kusivox", [\n'
              '            "CONFIG_WAKE_WORD_DISABLED=n",\n'
              '            "CONFIG_USE_ESP_WAKE_WORD=n",\n'
              '            "CONFIG_USE_AFE_WAKE_WORD=n",\n'
              '            "CONFIG_USE_CUSTOM_WAKE_WORD=y",\n'
              "            'CONFIG_CUSTOM_WAKE_WORD=\"kusi vox\"',\n"
              "            'CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"KusiVox\"',\n"
              '            "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=20",\n'
              '            "CONFIG_SR_MN_EN_MULTINET7_QUANT=y",\n'
              '        ], ["CONFIG_USE_CUSTOM_WAKE_WORD", "CONFIG_SR_MN_EN_MULTINET7_QUANT"]\n'
          )
          assert s.count(viejo) == 1
          open(p, "w", encoding="utf-8").write(s.replace(viejo, nuevo))
          EOF
          grep -n -A12 'if normalized == "kusivox"' scripts/build.py

      - name: Indicador de batería y red "KusiVox-XXXX"
        shell: bash
        run: |
          python3 - <<'EOF'
          p = "main/boards/bread-compact-wifi-lcd/compact_wifi_board_lcd.cc"
          s = open(p, encoding="utf-8").read()
          cambios = [
              ('#include "led/single_led.h"\n', '#include "led/single_led.h"\n#include "adc_battery_monitor.h"\n'),
              ("    LcdDisplay* display_;\n", "    LcdDisplay* display_;\n    AdcBatteryMonitor* adc_battery_monitor_ = nullptr;\n"),
              ("        InitializeButtons();\n",
               "        InitializeButtons();\n"
               "        // Bateria 18650: divisor 100k/100k en GPIO 1 (ADC1_CH0); USB conectado en GPIO 2\n"
               "        adc_battery_monitor_ = new AdcBatteryMonitor(ADC_UNIT_1, ADC_CHANNEL_0, 100000, 100000, GPIO_NUM_2);\n"),
              ("    virtual Display* GetDisplay() override {\n",
               "    virtual bool GetBatteryLevel(int &level, bool& charging, bool& discharging) override {\n"
               "        charging = adc_battery_monitor_->IsCharging();\n"
               "        discharging = adc_battery_monitor_->IsDischarging();\n"
               "        level = adc_battery_monitor_->GetBatteryLevel();\n"
               "        return true;\n"
               "    }\n\n"
               "    virtual Display* GetDisplay() override {\n"),
          ]
          for viejo, nuevo in cambios:
              assert s.count(viejo) == 1, viejo
              s = s.replace(viejo, nuevo)
          open(p, "w", encoding="utf-8").write(s)
          p = "main/boards/common/wifi_board.cc"
          s = open(p, encoding="utf-8").read()
          assert s.count('config.ssid_prefix = "Xiaozhi";') == 1
          open(p, "w", encoding="utf-8").write(s.replace('config.ssid_prefix = "Xiaozhi";', 'config.ssid_prefix = "KusiVox";'))
          EOF
          grep -n "adc_battery_monitor_\|AdcBatteryMonitor" main/boards/bread-compact-wifi-lcd/compact_wifi_board_lcd.cc
          grep -n "ssid_prefix =" main/boards/common/wifi_board.cc

      - name: Emociones por frase (el personaje cambia mientras habla)
        shell: bash
        run: |
          cp proyecto/firmware/kusivox/emocion_por_frase.h main/emocion_por_frase.h
          python3 - <<'EOF'
          p = "main/application.cc"
          s = open(p, encoding="utf-8").read()
          inc = '#define TAG "Application"\n'
          assert s.count(inc) == 1
          s = s.replace(inc, '#include "emocion_por_frase.h"\n\n' + inc)
          viejo = ('                    ESP_LOGI(TAG, "<< %s", text->valuestring);\n'
                   '                    Schedule([display, message = std::string(text->valuestring),\n'
                   '                              glyphs = std::move(glyphs), bpp]() {\n'
                   '                        display->AddTextGlyphs(glyphs, bpp);\n'
                   '                        display->SetChatMessage("assistant", message.c_str());\n'
                   '                    });\n')
          nuevo = ('                    ESP_LOGI(TAG, "<< %s", text->valuestring);\n'
                   '                    const char* emocion_frase = kusivox::EmocionDeFrase(text->valuestring);\n'
                   '                    std::string emocion = emocion_frase ? emocion_frase : "";\n'
                   '                    if (!emocion.empty()) {\n'
                   '                        ESP_LOGI(TAG, "Emocion de la frase: %s", emocion.c_str());\n'
                   '                    }\n'
                   '                    Schedule([display, message = std::string(text->valuestring),\n'
                   '                              glyphs = std::move(glyphs), bpp, emocion]() {\n'
                   '                        display->AddTextGlyphs(glyphs, bpp);\n'
                   '                        display->SetChatMessage("assistant", message.c_str());\n'
                   '                        if (!emocion.empty()) {\n'
                   '                            display->SetEmotion(emocion.c_str());\n'
                   '                        }\n'
                   '                    });\n')
          assert s.count(viejo) == 1, "no se encontro el bloque sentence_start"
          s = s.replace(viejo, nuevo)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          grep -n "emocion_por_frase.h\|EmocionDeFrase\|SetEmotion(emocion" main/application.cc

      - name: Compilar (español, palabra de activación KusiVox)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi-lcd \
            --name bread-compact-wifi-lcd \
            --language es-ES \
            --wake-word kusivox \
            --build-options-json '{"display_model":"LCD_ST7789_240X240"}'

      - name: Comprobar que las caritas quedaron dentro y mostrar MD5
        shell: bash
        run: |
          python3 - <<'EOF'
          datos = open("build/merged-binary.bin", "rb").read()
          faltan = [n for n in ("neutral.gif", "happy.gif", "loving.gif", "confused.gif") if n.encode() not in datos]
          assert not faltan, f"faltan caritas: {faltan}"
          print("caritas dentro del firmware: OK")
          assert b"mn7_en" in datos, "falta el modelo MultiNet7 en ingles"
          assert b'"kusi vox"' in datos, "falta el comando kusi vox en index.json"
          assert b"KusiVox" in datos, "falta el nombre KusiVox"
          print("palabra de activacion KusiVox (mn7_en) dentro del firmware: OK")
          import glob, os
          for ruta in sorted(glob.glob("proyecto/caritas/*.gif")):
              assert open(ruta, "rb").read() in datos, f"falta la animacion {os.path.basename(ruta)}"
          print("21 animaciones del shih tzu dentro del firmware: OK")
          for clave in (b" no puede ser", b" dejame pensar", b" lo siento"):
              assert clave in datos, f"falta la regla {clave}"
          print("emociones por frase dentro del firmware: OK")
          EOF
          grep -E "CONFIG_USE_CUSTOM_WAKE_WORD|CONFIG_CUSTOM_WAKE_WORD|CONFIG_SR_MN_EN|CONFIG_USE_AFE_WAKE_WORD" sdkconfig
          cp build/merged-binary.bin "$ARCHIVO"
          MD5=$(md5sum "$ARCHIVO" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$ARCHIVO")
          echo "::notice title=Firmware correcto::archivo=$ARCHIVO md5=$MD5 bytes=$SIZE"

      - name: Subir el firmware (artefacto)
        uses: actions/upload-artifact@v7
        with:
          name: kusivox-v2-shihtzu
          path: ${{ env.ARCHIVO }}
          if-no-files-found: error

      - name: Guardar el firmware en la rama descarga-firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/proyecto"
          cd proyecto
          git fetch --depth 1 origin descarga-firmware
          git checkout -B descarga-firmware FETCH_HEAD
          mkdir -p firmware
          cp "../$ARCHIVO" firmware/
          git add "firmware/$ARCHIVO"
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -m "Firmware KusiVox v2: shih tzu animado y emociones por frase"
          git push origin descarga-firmware
